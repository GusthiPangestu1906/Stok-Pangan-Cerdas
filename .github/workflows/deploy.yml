name: Continuous Deployment (CD)

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  deploy-frontend:
    name: Deploy Frontend to Firebase Hosting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STOK_PANGAN_CERDAS }}
        run: |
          # Decode if Base64, or use raw if valid JSON
          if echo "$FIREBASE_SECRET" | base64 -d > /tmp/sa.json 2>/dev/null && grep -q "private_key" /tmp/sa.json; then
            echo "Successfully loaded Base64 service account key."
          else
            echo "$FIREBASE_SECRET" > /tmp/sa.json
          fi

          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
          npm install --global firebase-tools@latest
          firebase deploy --only hosting --project stok-pangan-cerdas --non-interactive
