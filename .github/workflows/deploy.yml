name: Continuous Deployment (CD)

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  deploy-frontend:
    name: Deploy Frontend to Firebase Hosting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STOK_PANGAN_CERDAS }}
        run: |
          if [ -n "$FIREBASE_TOKEN" ]; then
            echo "Deploying to Firebase using FIREBASE_TOKEN..."
            npm install --global firebase-tools@latest
            firebase deploy --only hosting --project stok-pangan-cerdas --token "$FIREBASE_TOKEN" --non-interactive
          else
            echo "Deploying to Firebase using Service Account..."
            python prepare-sa.py /tmp/sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
            npm install --global firebase-tools@latest
            firebase deploy --only hosting --project stok-pangan-cerdas --non-interactive
          fi
