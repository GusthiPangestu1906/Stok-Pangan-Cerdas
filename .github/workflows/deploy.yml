name: Continuous Deployment (CD)

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  deploy-frontend:
    name: Deploy Frontend to Firebase Hosting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare Clean Service Account
        id: prep
        env:
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STOK_PANGAN_CERDAS }}
        run: python prepare-sa.py /tmp/sa.json

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ steps.prep.outputs.sa_json }}
          create_credentials_file: true

      - name: Deploy to Firebase Hosting
        run: |
          npm install --global firebase-tools@latest
          firebase deploy --only hosting --project stok-pangan-cerdas --non-interactive
