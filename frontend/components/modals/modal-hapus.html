<!-- Modal: Konfirmasi Hapus Barang -->
<div id="modal-hapus"
  class="hidden fixed inset-0 bg-black/50 backdrop-blur-xs z-[60] flex items-center justify-center p-4"
  role="dialog" aria-modal="true" aria-labelledby="modal-hapus-title">
  <div class="bg-surface rounded-2xl w-full max-w-sm p-5 shadow-2xl border border-default">
    <h2 id="modal-hapus-title" class="font-heading text-[17px] font-semibold mb-2 text-primary">Hapus barang?</h2>
    <p id="modal-hapus-text" class="text-sm text-muted mb-5">Tindakan ini tidak bisa dibatalkan.</p>
    <div class="flex gap-2.5">
      <button id="modal-hapus-confirm" class="btn btn-danger h-11 flex-1 px-4 text-xs sm:text-sm font-semibold cursor-pointer">
        Ya, Hapus
      </button>
      <button id="modal-hapus-cancel" class="btn btn-outline h-11 px-4 text-xs sm:text-sm cursor-pointer">Batal</button>
    </div>
  </div>
</div>
