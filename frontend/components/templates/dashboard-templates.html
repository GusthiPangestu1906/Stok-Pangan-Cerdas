<!-- Component Templates Registry (Dynamic Client-Side UI Templates) -->

<!-- 1. Action Buttons Template -->
<template id="tmpl-action-buttons">
  <button type="button" data-action="ai" class="js-btn-ai btn btn-outline btn-icon border transition hidden cursor-pointer"
    title="Minta Saran AI">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 3v3M12 18v3M4.9 7.5l2.6 1.5M16.5 15l2.6 1.5M4.9 16.5l2.6-1.5M16.5 9l2.6-1.5" />
      <circle cx="12" cy="12" r="3.4" />
    </svg>
  </button>
  <button type="button" data-action="label" class="btn btn-outline btn-icon hover:!border-purple-300 hover:!text-purple-700 cursor-pointer"
    title="Cetak Barcode & Label Rak">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 2H2v10l9.29 9.29c.94.94 2.48.94 3.42 0l6.58-6.58c.94-.94.94-2.48 0-3.42L12 2Z" />
      <circle cx="7" cy="7" r=".5" fill="currentColor" />
    </svg>
  </button>
  <button type="button" data-action="edit" class="btn btn-outline btn-icon cursor-pointer" title="Edit">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 20h9" />
      <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z" />
    </svg>
  </button>
  <button type="button" data-action="hapus" class="btn btn-outline btn-icon hover:!border-danger hover:!text-danger cursor-pointer"
    title="Hapus">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6h16z" />
    </svg>
  </button>
</template>

<!-- 2. Desktop Table Row Template -->
<template id="tmpl-table-row">
  <div
    class="js-row-container inventory-grid px-5 py-3 border-b border-subtle hover:bg-hover/60 transition-colors items-center"
    role="row">
    <span class="js-dot dot shrink-0 hidden" aria-hidden="true"></span>

    <!-- 1. BARANG -->
    <div class="flex items-center gap-2.5 min-w-0" role="cell">
      <span class="js-status-dot w-2 h-2 rounded-full shrink-0" aria-hidden="true"></span>
      <div class="min-w-0">
        <div class="js-nama text-[13.5px] font-semibold truncate text-primary"></div>
        <div class="js-kategori text-[11px] text-muted truncate mt-px"></div>
      </div>
    </div>

    <!-- 2. STOK -->
    <div class="text-center whitespace-nowrap" role="cell">
      <span class="js-stok text-[14px] font-bold text-primary font-heading"></span>
    </div>

    <!-- 3. KADALUARSA -->
    <div class="flex flex-col min-w-0" role="cell">
      <div class="js-sisa-text text-[13px] font-semibold text-secondary whitespace-nowrap"></div>
      <div class="js-kadaluarsa text-[11px] text-muted mt-px whitespace-nowrap"></div>
    </div>

    <!-- 4. STATUS -->
    <div class="flex justify-center" role="cell">
      <span class="js-status-badge badge text-[11px]"></span>
    </div>

    <!-- 5. AKSI -->
    <div class="js-actions flex items-center justify-end gap-1.5" data-actions role="cell"></div>
  </div>
</template>

<!-- 3. Mobile / Responsive Card Template -->
<template id="tmpl-card">
  <article class="card p-4 flex flex-col gap-3 shadow-xs hover:shadow-sm transition rounded-xl">
    <div class="flex items-start justify-between gap-2">
      <div class="min-w-0">
        <div class="js-nama text-[15.5px] font-bold tracking-tight text-primary truncate font-heading"></div>
        <div class="js-kategori text-[12.5px] text-soft mt-0.5"></div>
      </div>
      <span class="js-status-badge badge shrink-0"></span>
    </div>

    <div class="flex flex-col gap-1.5 py-1">
      <div class="flex items-center justify-between text-[13px]">
        <span class="text-muted">Stok: <strong class="js-stok text-primary font-semibold"></strong></span>
        <span class="js-sisa-text font-medium text-secondary"></span>
      </div>
      <div class="h-1.5 rounded-full bg-subtle overflow-hidden">
        <div class="js-progress-bar progress-bar"></div>
      </div>
      <div class="text-[12px] text-light flex items-center justify-between mt-0.5">
        <span>Kadaluarsa: <span class="js-kadaluarsa font-medium text-secondary"></span></span>
      </div>
    </div>

    <div class="js-actions pt-2.5 border-t border-subtle flex items-center justify-between gap-2 w-full" data-actions></div>
  </article>
</template>

<!-- 4. AI Recommendation Card Template -->
<template id="tmpl-ai-card">
  <article class="js-container card p-4 flex flex-col gap-3">
    <div class="flex items-start justify-between gap-2.5">
      <div class="flex items-center gap-2 min-w-0">
        <span class="js-dot dot shrink-0" aria-hidden="true"></span>
        <div class="js-nama text-[15px] font-semibold tracking-tight truncate text-primary"></div>
      </div>
      <span class="js-status-badge badge"></span>
    </div>
    <div class="js-content-wrapper bg-ai border border-ai-subtle rounded-[12px] p-3.5">
      <span class="js-jenis-badge badge"></span>
      <div class="js-saran text-[13.5px] text-ai-dark leading-relaxed mt-2.5"></div>
    </div>
    <div class="js-actions flex gap-2"></div>
  </article>
</template>
