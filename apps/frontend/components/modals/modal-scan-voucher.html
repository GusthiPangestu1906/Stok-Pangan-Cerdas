<!-- Modal: Simulator Scan & Validasi Kupon Kasir -->
<div id="modal-scan-voucher"
  class="hidden fixed inset-0 bg-black/50 backdrop-blur-xs z-[60] flex items-center justify-center p-2.5 sm:p-4 overflow-y-auto"
  role="dialog" aria-modal="true" aria-labelledby="modal-scan-title">
  <div
    class="bg-surface rounded-2xl w-full max-w-[94vw] sm:max-w-md max-h-[92vh] flex flex-col shadow-2xl border border-default overflow-hidden my-auto box-border">
    
    <!-- Modal Header -->
    <div
      class="px-3.5 py-2.5 sm:px-5 sm:py-3.5 border-b border-subtle flex items-center justify-between bg-emerald-50/70 shrink-0">
      <div class="flex items-center gap-2 min-w-0">
        <span
          class="inline-flex items-center justify-center w-7 h-7 sm:w-8 sm:h-8 rounded-lg bg-emerald-100 text-emerald-800 shrink-0" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2" />
            <rect x="7" y="7" width="10" height="10" rx="1" />
          </svg>
        </span>
        <div class="min-w-0">
          <h2 id="modal-scan-title" class="font-heading text-[14px] sm:text-[16px] font-bold text-primary truncate leading-tight">
            Simulator Validasi Kupon
          </h2>
          <p class="text-[10px] sm:text-[11.5px] text-muted truncate">Periksa barcode voucher belanja</p>
        </div>
      </div>
      <button id="modal-scan-close" class="text-light hover:text-primary transition p-1 shrink-0 ml-1 cursor-pointer"
        aria-label="Tutup simulator">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" aria-hidden="true">
          <path d="M18 6 6 18M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Modal Body (Scan Input + Quick Vouchers + Live Result) -->
    <div class="p-3 sm:p-4 overflow-y-auto min-h-0 flex-1 overscroll-contain flex flex-col gap-3 text-xs">
      
      <!-- Scanner Inputs (Camera Viewport, Barcode String, Basket Simulation) -->
      <div class="flex flex-col gap-2.5">
        <div>
          <button type="button" id="btn-scan-camera"
            class="btn btn-outline h-8 sm:h-9 px-3 text-xs font-semibold w-full flex items-center justify-center gap-1.5 mb-2 cursor-pointer">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2Z" />
              <circle cx="12" cy="13" r="4" />
            </svg>
            <span>Scan dengan Kamera</span>
          </button>
          <div id="scan-camera-wrap" class="hidden mb-2 rounded-xl overflow-hidden border border-subtle relative">
            <video id="scan-camera-video" class="w-full h-40 sm:h-48 object-cover bg-black" playsinline muted autoplay></video>
            <button type="button" id="btn-scan-camera-close"
              class="absolute top-1.5 right-1.5 bg-black/60 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs cursor-pointer"
              aria-label="Tutup kamera">
              &times;
            </button>
            <p id="scan-camera-status" class="absolute bottom-1.5 left-1.5 right-1.5 text-[10px] text-white bg-black/50 rounded px-1.5 py-0.5 text-center"></p>
          </div>
        </div>

        <div>
          <label for="scan-input-kode" class="form-label text-[11px] sm:text-xs">Kode Barcode Voucher</label>
          <div class="flex gap-1.5 items-center w-full">
            <input id="scan-input-kode" type="text"
              class="input-field font-mono uppercase text-xs sm:text-sm tracking-wider font-semibold flex-1 min-w-0 py-1.5 sm:py-2 px-2.5" placeholder="VCHR-KEJ-88219" />
            <button type="button" id="btn-do-scan"
              class="btn btn-primary h-8 sm:h-9 px-3 text-xs font-semibold shrink-0 flex items-center gap-1 shadow-sm whitespace-nowrap cursor-pointer">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m21 21-4.3-4.3" />
                <circle cx="11" cy="11" r="8" />
              </svg>
              <span>Validasi</span>
            </button>
          </div>
        </div>

        <div>
          <label for="scan-input-belanja" class="form-label text-[11px] sm:text-xs">Simulasi Total Belanja Pelanggan (Rp)</label>
          <input id="scan-input-belanja" type="number" step="1000" min="0" value="35000"
            class="input-field font-semibold text-xs sm:text-sm py-1.5 sm:py-2 px-2.5 w-full" placeholder="35000" />
        </div>
      </div>

      <!-- Quick Pick Active Vouchers Demo -->
      <div>
        <div class="text-[10.5px] sm:text-[11px] font-semibold text-muted mb-1">Kupon Aktif Tersedia (Klik untuk Coba):</div>
        <div id="scan-quick-vouchers" class="flex flex-wrap gap-1 w-full" role="group" aria-label="Daftar Kupon Cepat"></div>
      </div>

      <!-- Live Validation Result Feedback Box -->
      <div id="scan-result-container" class="mt-0.5 p-3 rounded-xl border border-dashed border-gray-200 bg-hover/40 min-h-[90px] flex flex-col items-center justify-center text-center w-full box-border" aria-live="polite">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9aa89e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mb-1 opacity-60" aria-hidden="true">
          <path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z" />
          <path d="M13 5v2" /><path d="M13 17v2" /><path d="M13 11v2" />
        </svg>
        <span class="text-muted font-medium text-[11px]">Ketik atau pilih kode barcode di atas, lalu klik "Validasi"</span>
      </div>

    </div>

    <!-- Modal Footer -->
    <div class="px-3.5 py-2.5 sm:px-5 sm:py-3 border-t border-subtle bg-surface flex items-center justify-between gap-2 shrink-0">
      <button type="button" id="btn-kasir-create-voucher"
        class="btn btn-outline h-8 sm:h-9 px-2.5 sm:px-3 text-[11px] sm:text-xs font-semibold flex items-center gap-1 border-emerald-300 text-emerald-800 hover:bg-emerald-50 transition shrink-0 cursor-pointer">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 5v14M5 12h14" />
        </svg>
        <span>Buat Kupon</span>
      </button>
      <button type="button" id="modal-scan-close-btn" class="btn btn-outline h-8 sm:h-9 px-3.5 sm:px-4 text-xs font-medium shrink-0 cursor-pointer">Tutup</button>
    </div>

  </div>
</div>
