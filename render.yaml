services:
  # Backend Web Service (Laravel 13 + PostgreSQL Supabase)
  - type: web
    name: stok-pangan-cerdas-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    branch: develop
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: "Stok Pangan Cerdas"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        fromService:
          type: web
          name: stok-pangan-cerdas-backend
          property: host
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_SSLMODE
        value: require
      # Masukkan URL connection string dari Supabase pada Environment Render
      - key: DATABASE_URL
        sync: false
      # Masukkan Google Gemini API Key pada Environment Render
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_MODEL_FALLBACKS
        value: gemini-3.1-flash-lite,gemini-3.6-flash
      - key: RUN_MIGRATIONS
        value: "true"
      - key: RUN_SEEDER
        value: "true"

  # Frontend Static Site
  - type: web
    name: stok-pangan-cerdas-frontend
    runtime: static
    plan: free
    region: singapore
    branch: develop
    rootDir: frontend
    publishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
